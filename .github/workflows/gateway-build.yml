name: Build Gateway

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tag
        shell: bash
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" \
            && "${GITHUB_HEAD_REF}" == "codex/nanokvm-c-refactor-20260929" \
            && "${PR_HEAD_REPO}" == "${GITHUB_REPOSITORY}" ]]; then
            echo "tags=${REGISTRY}/${IMAGE_NAME}:pr-7-${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tags=${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            dev_tag="dev-$(date -u +%s)"
            tags="${REGISTRY}/${IMAGE_NAME}:${dev_tag}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              tags="${tags},${REGISTRY}/${IMAGE_NAME}:main"
            fi
            echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' || (github.head_ref == 'codex/nanokvm-c-refactor-20260929' && github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
