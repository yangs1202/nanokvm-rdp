name: Build Gateway

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: registry.yangs.sh
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: yangs-corp-runners
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: yangs-corp/action-registry-login@v0.1.3
        with:
          registry: ${{ env.REGISTRY }}

      - name: Set image tags
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tags=${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            dev_tag="dev-$(date -u +%s)"
            tags="${REGISTRY}/${IMAGE_NAME}:${dev_tag}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              tags="${tags},${REGISTRY}/${IMAGE_NAME}:main"
            fi
            echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
